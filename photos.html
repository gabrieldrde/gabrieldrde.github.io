<div class="lightbox" id="lightbox">
    <button class="lightbox-close" aria-label="Fechar">&times;</button>

<button class="lightbox-prev" aria-label="Foto anterior"></button>

    <img id="lightbox-image" src="" alt="">

<button class="lightbox-next" aria-label="Próxima foto"></button>
</div>



<script>
const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightbox-image");

const photos = Array.from(document.querySelectorAll(".photo img"));
const prevButton = document.querySelector(".lightbox-prev");
const nextButton = document.querySelector(".lightbox-next");

let currentIndex = 0;
let scale = 1;
let posX = 0;
let posY = 0;

let startX = 0;
let startY = 0;
let startPosX = 0;
let startPosY = 0;
let startDistance = 0;
let startScale = 1;
let initialMidX = 0;
let initialMidY = 0;

let startTime = 0;
let isPinching = false;
let isDragging = false;

function updateImage() {
    lightboxImage.style.transform =
        `translate(${posX}px, ${posY}px) scale(${scale})`;
}

function resetZoom() {
    scale = 1;
    posX = 0;
    posY = 0;
    updateImage();
}

function showPhoto(index) {
    currentIndex = (index + photos.length) % photos.length;

    resetZoom();

    lightboxImage.src = photos[currentIndex].src;
    lightboxImage.alt = photos[currentIndex].alt;
}

photos.forEach((img, index) => {
    img.addEventListener("click", () => {
        showPhoto(index);
        lightbox.classList.add("active");
        document.body.style.overflow = "hidden";
    });
});

function nextPhoto() {
    showPhoto(currentIndex + 1);
}

function previousPhoto() {
    showPhoto(currentIndex - 1);
}

nextButton.addEventListener("click", nextPhoto);
prevButton.addEventListener("click", previousPhoto);

// GESTOS NO CELULAR

function distance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
}

lightbox.addEventListener("touchstart", event => {
    if (event.touches.length === 2) {
        isPinching = true;
        isDragging = false;

        startDistance = distance(event.touches);
        startScale = scale;

        initialMidX = (event.touches[0].clientX + event.touches[1].clientX) / 2;
        initialMidY = (event.touches[0].clientY + event.touches[1].clientY) / 2;

        startPosX = posX;
        startPosY = posY;

    } else if (event.touches.length === 1) {
        startX = event.touches[0].clientX;
        startY = event.touches[0].clientY;

        startPosX = posX;
        startPosY = posY;

        startTime = Date.now();
        isDragging = scale > 1;
    }
}, { passive: false });

lightbox.addEventListener("touchmove", event => {
    if (event.touches.length === 2) {
        event.preventDefault();

        const newDistance = distance(event.touches);

        scale = Math.min(4, Math.max(1, startScale * newDistance / startDistance));

        const midX = (event.touches[0].clientX + event.touches[1].clientX) / 2;
        const midY = (event.touches[0].clientY + event.touches[1].clientY) / 2;

        posX = startPosX + (midX - initialMidX);
        posY = startPosY + (midY - initialMidY);

        if (scale === 1) {
            posX = 0;
            posY = 0;
        }

        updateImage();

    } else if (event.touches.length === 1 && scale > 1) {
        event.preventDefault();

        posX = startPosX + event.touches[0].clientX - startX;
        posY = startPosY + event.touches[0].clientY - startY;

        updateImage();
    }
}, { passive: false });

lightbox.addEventListener("touchend", event => {
    if (event.touches.length < 2) {
        isPinching = false;
    }

    if (event.touches.length === 0) {
        if (scale <= 1) {
            scale = 1;
            posX = 0;
            posY = 0;

            const endTouch = event.changedTouches[0];
            const dx = startX - endTouch.clientX;
            const dy = startY - endTouch.clientY;

            if (
                Math.abs(dx) > 60 &&
                Math.abs(dx) > Math.abs(dy) &&
                Date.now() - startTime < 700
            ) {
                dx > 0 ? nextPhoto() : previousPhoto();
            }
        }

        isDragging = false;
        updateImage();
    }
}, { passive: true });

// FECHAR

function closeLightbox() {
    lightbox.classList.remove("active");
    document.body.style.overflow = "";
    resetZoom();
}

lightbox.addEventListener("click", event => {
    if (
        event.target === lightbox ||
        event.target.classList.contains("lightbox-close")
    ) {
        closeLightbox();
    }
});

document.addEventListener("keydown", event => {
    if (!lightbox.classList.contains("active")) return;

    if (event.key === "Escape") closeLightbox();

    if (event.key === "ArrowRight") nextPhoto();

    if (event.key === "ArrowLeft") previousPhoto();
});

document.addEventListener("contextmenu", event => {
    if (event.target.closest(".photo img, .lightbox img")) {
        event.preventDefault();
    }
});
</script>


<script>

});
