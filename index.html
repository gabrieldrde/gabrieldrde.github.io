    <!-- VISUALIZADOR DE FOTOGRAFIAS -->
    <div class="home-lightbox" id="home-lightbox">

        <button class="home-lightbox-close" aria-label="Fechar">&times;</button>

        <button class="home-lightbox-prev" aria-label="Foto anterior"></button>

        <img id="home-lightbox-image" src="" alt="">

        <button class="home-lightbox-next" aria-label="Próxima foto"></button>

    </div>

    <script>
        const homeLightbox = document.getElementById("home-lightbox");
        const homeLightboxImage = document.getElementById("home-lightbox-image");

        const homePhotos = Array.from(
            document.querySelectorAll(".home-photo img")
        );

        const homePrev = document.querySelector(".home-lightbox-prev");
        const homeNext = document.querySelector(".home-lightbox-next");
        const homeClose = document.querySelector(".home-lightbox-close");

        let homeCurrentIndex = 0;

        function showHomePhoto(index) {
            homeCurrentIndex = (index + homePhotos.length) % homePhotos.length;

            homeLightboxImage.src = homePhotos[homeCurrentIndex].src;
            homeLightboxImage.alt = homePhotos[homeCurrentIndex].alt;
        }

        homePhotos.forEach((img, index) => {
            img.addEventListener("click", () => {
                showHomePhoto(index);
                homeLightbox.classList.add("active");
                document.body.style.overflow = "hidden";
            });
        });

        homeNext.addEventListener("click", () => {
            showHomePhoto(homeCurrentIndex + 1);
        });

        homePrev.addEventListener("click", () => {
            showHomePhoto(homeCurrentIndex - 1);
        });

        function closeHomeLightbox() {
            homeLightbox.classList.remove("active");
            document.body.style.overflow = "";
        }

        homeClose.addEventListener("click", closeHomeLightbox);

        homeLightbox.addEventListener("click", event => {
            if (event.target === homeLightbox) {
                closeHomeLightbox();
            }
        });

        document.addEventListener("keydown", event => {
            if (!homeLightbox.classList.contains("active")) return;

            if (event.key === "Escape") {
                closeHomeLightbox();
            }

            if (event.key === "ArrowRight") {
                showHomePhoto(homeCurrentIndex + 1);
            }

            if (event.key === "ArrowLeft") {
                showHomePhoto(homeCurrentIndex - 1);
            }
        });
    </script>
